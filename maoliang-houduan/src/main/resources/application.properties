spring.config.import=optional:file:./application-local.properties
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:maoliang}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/New_York&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jackson.deserialization.accept-float-as-int=false

# Redis is an optional cache; MySQL remains the source of truth.
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.connect-timeout=300ms
spring.data.redis.timeout=300ms
spring.data.redis.repositories.enabled=false
app.cache.hot-goods.enabled=${HOT_GOODS_CACHE_ENABLED:true}
app.cache.hot-goods.ttl=${HOT_GOODS_CACHE_TTL:5m}

# ?? multipart ???
spring.servlet.multipart.enabled=true

# ????????
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=0

upload.directory=./img/
