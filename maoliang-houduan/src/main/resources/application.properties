spring.config.import=optional:file:./application-local.properties
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:maoliang}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/New_York&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
app.catalog.images-dir=${CATALOG_IMAGES_DIR:../data/images}
app.ai.qwen.api-key=${DASHSCOPE_API_KEY:}
app.ai.qwen.base-url=${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
app.ai.qwen.chat-model=${QWEN_CHAT_MODEL:qwen-plus}
app.ai.qwen.embedding-model=${QWEN_EMBEDDING_MODEL:text-embedding-v4}
app.ai.dify.api-key=${DIFY_API_KEY:}
app.ai.dify.base-url=${DIFY_BASE_URL:https://api.dify.ai/v1}
app.ai.dify.tool-token=${DIFY_TOOL_TOKEN:}
app.rag.mq.enabled=${RAG_MQ_ENABLED:false}
app.rag.mq.publish-delay-ms=${RAG_MQ_PUBLISH_DELAY_MS:2000}
app.rag.index-concurrency=${RAG_INDEX_CONCURRENCY:4}
app.rag.search-min-score=${RAG_SEARCH_MIN_SCORE:0.85}
app.rag.search-score-window=${RAG_SEARCH_SCORE_WINDOW:0.03}
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:kittymarket}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:kittymarket-local}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jackson.deserialization.accept-float-as-int=false

# Redis is an optional cache; MySQL remains the source of truth.
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.connect-timeout=300ms
spring.data.redis.timeout=300ms
spring.data.redis.repositories.enabled=false
app.cache.hot-goods.enabled=${HOT_GOODS_CACHE_ENABLED:true}
app.cache.hot-goods.ttl=${HOT_GOODS_CACHE_TTL:5m}

# ?? multipart ???
spring.servlet.multipart.enabled=true

# ????????
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=0

upload.directory=./img/
