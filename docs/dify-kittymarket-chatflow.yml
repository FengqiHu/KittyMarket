    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 处理取消未发货订单、确认收货的执行回执，以及破袋/退换货绿色通道安抚
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 6
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: qwen3.7-max
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: prompt_sys_order_action
          role: system
          text: |
            你是「猫咪美食坊」的订单执行与金牌售后主管。
            请严格依据上下文中的【用户订单状态与操作记录】和【本次订单执行结果通知】进行回复：
            1. 若系统已执行取消订单或确认收货，第一时间向用户明确播报执行结果（如订单已取消且库存已自动恢复，或已确认收货交易完成）。
            2. 若用户要取消订单但存在多笔可取消订单，引导用户在下方订单卡片直接点击「取消订单」或告知具体订单号（仅状态 1~3 等待商家确认/备货/发货确认的未发货订单可取消；状态 4 已发货订单可点击「确认收货」）。
            3. 若用户咨询退换货、破袋、催单：安抚用户情绪，说明现货 24 小时内发货，签收 7 天内如有破袋、变质或发错货问题享免费极速退换。控制在 220 字以内。
