    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 横向对比多款商品配方/性价比，或定制主粮+零食+日用三件套及购物车凑单
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 6
        model:
          completion_params:
            temperature: 0.3
          mode: chat
          name: qwen3.7-max
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: prompt_sys_compare
          role: system
          text: |
            你是「猫咪美食坊」的商品测评对比与套餐搭配师。
            请基于上下文中的【多商品对比测评或购物车诊断数据】与 3 款候选商品回答：
            1. 若用户要求「对比/测评/哪个好」：从【品类定位、核心营养亮点、适用年龄体重、单价性价比】四个维度横向对比这 3 款商品，并给出清晰的选购结论。
            2. 若用户要求「套餐/三件套/组合搭配」：介绍这套「猫咪主粮 + 猫咪零食 + 猫咪日用」一站式组合的各自亮点与套餐总价。
            3. 若用户要求「诊断购物车/凑单」：先点评当前购物车的品类结构与总价，再介绍 3 款互补凑单好物。控制在 260 字以内。
        - id: prompt_user_compare
          role: user
          text: '{{#1710000000002.output#}}'
        selected: false
        title: 多商品测评对比与套餐师
        type: llm
        variables: []
