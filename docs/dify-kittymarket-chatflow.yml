    - data:
        classes:
        - id: class_shopping
          name: 1. 个性化选粮与好物导购（根据用户需求、预算、猫咪品种/年龄或历史偏好推荐 3 款在售商品）
        - id: class_compare
          name: 2. 多商品横向测评对比、主粮+零食+日用三件套组合搭配、或购物车结构诊断凑单
        - id: class_feeding
          name: 3. 猫咪科学喂养与营养健康顾问（计算每日吃多少克猫粮、饮水量、七日换粮法、软便/吐毛球/泪痕/绝育控重调理）
        - id: class_order
          name: 4. 订单查询、取消未发货订单、确认收货、催发货、破袋理赔与退换货售后政策
        - id: class_general
          name: 5. 商城全能管家与日常综合咨询（问候、功能介绍、账号密码与收货地址簿管理）
        desc: 基于 qwen3.7-max 将用户咨询精准分发至 5 条专业服务链路
        instruction: 请重点根据用户在【用户问题】中的核心诉求（以及当前识别意图字段）将其归入最匹配的分类。
        model:
