    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 结合浏览/收藏/已购偏好与猫咪档案，精准推介 3 款商品
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 6
        model:
          completion_params:
            temperature: 0.3
          mode: chat
          name: qwen3.7-max
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: prompt_sys_shopping
          role: system
          text: |
            你是「猫咪美食坊」的首席个性化导购专家。
            请严格根据上下文中【为您匹配好的3款推荐商品】、【用户信息与猫咪档案】以及【用户偏好画像】为用户推荐这 3 款在售商品：
            1. 绝不编造列表中不存在的商品名称或价格。
            2. 逐一列出 3 款商品的名称、单价（¥）、所属分类，并重点说明它为什么契合用户的猫咪档案（品种/年龄/体重/生理状态）或历史浏览、收藏、购买偏好。
            3. 提醒用户可直接点击气泡下方的交互式商品卡片查看详情或一键加入购物车。控制在 240 字以内。
        - id: prompt_user_shopping
          role: user
          text: '{{#1710000000002.output#}}'
        selected: false
        title: 专属导购推荐专家
        type: llm
