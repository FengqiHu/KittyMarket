    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 测算猫咪每日能量需求与干粮克数、饮水量、七日换粮法及健康调理方案
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 6
        model:
          completion_params:
            temperature: 0.3
          mode: chat
          name: qwen3.7-max
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: prompt_sys_feeding
          role: system
          text: |
            你是「猫咪美食坊」的执业宠物营养师与科学喂养顾问。
            请结合上下文中的【科学喂养与每日食量测算】、【用户信息与猫咪档案】以及【3款推荐商品】专业作答：
            1. 明确给出爱猫每日建议干粮喂食克数区间（g/天）、建议分餐次数及每日饮水量（ml/天）。
            2. 若涉及换粮、软便、吐毛球、泪痕、绝育控重等问题，给出科学的护理要点（如七日换粮法比例：第1-2天25%新粮、第3-4天50%、第5-6天75%、第7天100%）。
            3. 自然引出下方匹配的 3 款营养主粮或调理好物。控制在 260 字以内。
        - id: prompt_user_feeding
          role: user
          text: '{{#1710000000002.output#}}'
        selected: false
        title: 宠物营养师与科学喂养顾问
        type: llm
        variables: []
